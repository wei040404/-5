<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東英小幫手 - 消防勤務快速入口</title>
    <style>
        :root {
            --fire-red: #d32f2f;
            --water-blue: #0288d1;
            --oxygen-gray: #455a64;
            --alarm-orange: #f57c00;
            --video-purple: #673ab7;
            --cloud-teal: #009688;
            --edit-pink: #c2185b;
            --chem-yellow: #fbc02d; /* 化學雲：警告黃 */
            --key-black: #212121;  /* 帳密：隱密黑 */
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 550px;
            padding: 20px;
        }
        h1 {
            grid-column: span 2;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-size: 1.6rem;
        }
        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 110px;
            text-decoration: none;
            color: white;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.05);
            text-align: center;
            cursor: pointer;
        }
        .nav-button:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            border-color: rgba(255,255,255,0.3);
        }
        .nav-button:active {
            transform: translateY(1px);
        }
        .nav-button span { margin-top: 5px; }

        /* 顏色分配 */
        .btn-fire  { background: var(--fire-red); }
        .btn-water { background: var(--water-blue); }
        .btn-ox    { background: var(--oxygen-gray); }
        .btn-list  { background: var(--alarm-orange); }
        .btn-video { background: var(--video-purple); }
        .btn-cloud { background: var(--cloud-teal); }
        .btn-edit  { background: var(--edit-pink); }
        .btn-chem  { background: var(--chem-yellow); color: #000; } 
        .btn-key   { background: var(--key-black); grid-column: span 2; border: 2px solid #555; }

        @media (max-width: 400px) {
            .dashboard { grid-template-columns: 1fr; }
            h1, .btn-key { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>🚒 東英小幫手 🚒</h1>

        <a href="https://tccfd200.quickconnect.to/sharing/ewvldWoPw" class="nav-button btn-fire" target="_blank">
            <span>📸 火調照片上傳</span>
        </a>

        <a href="https://www.google.com/maps/d/u/0/edit?hl=zh-TW&mid=1U47yx3OCas7OQoK0Lr4GzBlCA1A&ll=24.140317954186422%2C120.70343587929847&z=17" class="nav-button btn-water" target="_blank">
            <span>📍 水源地圖</span>
        </a>

        <a href="https://docs.google.com/spreadsheets/d/1Rh-8hAtzcMaQl1UNm2aSVOIaoOi2L8cA/edit" class="nav-button btn-ox" target="_blank">
            <span>🧪 氧氣鋼瓶更換</span>
        </a>

        <a href="https://docs.google.com/spreadsheets/d/1kCAaGRusMmRJqsVhzDDvUd_ze3ZQLocN/edit" class="nav-button btn-list" target="_blank">
            <span>📋 住警器清冊</span>
        </a>

        <a href="https://drive.google.com/drive/u/0/folders/1DRjaIW3rO4T4EP6HzvJu2ruVNFuVvuCp" class="nav-button btn-video" target="_blank">
            <span>📹 消防車影像下載教學</span>
        </a>

        <a href="https://drive.google.com/drive/u/2/folders/1QhdDSkME6r_MW-cP6moRxuV9oUsLy15u" class="nav-button btn-cloud" target="_blank">
            <span>🔥 SCBA電量查看</span>
        </a>

        <a href="https://drive.google.com/drive/u/2/folders/1HocOcJCDdDy6lJbcP1imEgutKg2022V1" class="nav-button btn-edit" target="_blank">
            <span>🎬 救護影像剪輯教學</span>
        </a>

        <a href="https://chemicloud.moenv.gov.tw/ChemiCloud/index.html" class="nav-button btn-chem" target="_blank">
            <span>☁️ 化學雲系統</span>
        </a>

        <!-- 修正後的帳密按鈕 -->
        <a href="https://docs.google.com/spreadsheets/d/1FZboC0GYDT-tJKYPHWTxvIZksXEW6iKE/edit?gid=671077091#gid=671077091" class="nav-button btn-key" target="_blank">
            <span>🔐 勤業務帳密 (需授權)</span>
        </a>
    </div>

</body>
</html>
